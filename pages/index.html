<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stockwise — Select Store</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="store-page">
  <div class="store-badge">
    <span class="badge-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </span>
    Stockwise Admin Panel
  </div>

  <h1 class="store-title">Select a Store</h1>
  <p class="store-sub">Choose a store to view its forecast and analytics dashboard.</p>

  <div class="store-grid">

    <!-- Store X -->
    <a href="pages/login.html?store=x" class="store-card">
      <div class="store-card-top">
        <div class="store-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <span class="arrow">→</span>
      </div>
      <div class="store-name">Store X</div>
      <div class="store-loc">California, USA</div>
      <div class="store-sku">
        <span>Total SKUs</span>
        <strong>3,049</strong>
      </div>
    </a>

    <!-- Store Y -->
    <a href="pages/login.html?store=y" class="store-card">
      <div class="store-card-top">
        <div class="store-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <span class="arrow">→</span>
      </div>
      <div class="store-name">Store Y</div>
      <div class="store-loc">Texas, USA</div>
      <div class="store-sku">
        <span>Total SKUs</span>
        <strong>3,049</strong>
      </div>
    </a>

    <!-- Store Z -->
    <a href="pages/login.html?store=z" class="store-card">
      <div class="store-card-top">
        <div class="store-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <span class="arrow">→</span>
      </div>
      <div class="store-name">Store Z</div>
      <div class="store-loc">Wisconsin, USA</div>
      <div class="store-sku">
        <span>Total SKUs</span>
        <strong>3,049</strong>
      </div>
    </a>

  </div>

  <p class="store-footer">Stockwise © 2026 — Inventory & Forecast Management</p>
</div>
</body>
</html>
