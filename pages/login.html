<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Stockwise</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="login-page">
  <a href="../index.html" class="back-link">← Back to stores</a>
  <div class="login-card">
    <div class="login-store-header">
      <div class="store-icon-sm"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <div>
        <div class="signing-in-label">Signing in to</div>
        <div class="signing-in-store" id="storeName">Store X</div>
      </div>
    </div>
    <div class="login-divider"></div>
    <h2 class="login-title">Sign in</h2>
    <p class="login-sub">Enter your credentials to continue.</p>
    <div class="form-group">
      <label class="form-label">Username</label>
      <div class="input-wrap">
        <span class="input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
        <input type="text" class="form-input" placeholder="your.username">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-wrap">
        <span class="input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <input type="password" class="form-input" value="••••••••">
      </div>
    </div>
    <a href="dashboard.html" class="btn-signin">Sign in &amp; view forecast</a>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const store = params.get('store');
  const names = {x:'Store X',y:'Store Y',z:'Store Z'};
  if(store && names[store]) document.getElementById('storeName').textContent = names[store];
</script>
</body>
</html>
